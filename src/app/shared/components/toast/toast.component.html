@if (message()) {
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#041B3C] text-white text-xs px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 z-50 flex items-center gap-2">
    <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span>{{ message() }}</span>
  </div>
}
