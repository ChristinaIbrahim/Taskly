<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
    
    <div class="flex items-center justify-between px-6 pt-6 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#D2E3FF] text-[#003D9B] flex items-center justify-center font-bold">
          <svg width="22" height="16" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg">
           <path d="M17 10V7H14V5H17V2H19V5H22V7H19V10H17ZM8 8C6.9 8 5.95833 7.60833 5.175 6.825C4.39167 6.04167 4 5.1 4 4C4 2.9 4.39167 1.95833 5.175 1.175C5.95833 0.391667 6.9 0 8 0C9.1 0 10.0417 0.391667 10.825 1.175C11.6083 1.95833 12 2.9 12 4C12 5.1 11.6083 6.04167 10.825 6.825C10.0417 7.60833 9.1 8 8 8ZM0 16V13.2C0 12.6333 0.145833 12.1125 0.4375 11.6375C0.729167 11.1625 1.11667 10.8 1.6 10.55C2.63333 10.0333 3.68333 9.64583 4.75 9.3875C5.81667 9.12917 6.9 9 8 9C9.1 9 10.1833 9.12917 11.25 9.3875C12.3167 9.64583 13.3667 10.0333 14.4 10.55C14.8833 10.8 15.2708 11.1625 15.5625 11.6375C15.8542 12.1125 16 12.6333 16 13.2V16H0Z" fill="#003D9B"/>
          </svg>

        </div>
        <div>
          <h3 class="text-lg font-bold text-[#0F172A]">Invite Team Member</h3>
          <p class="text-xs text-[#64748B]">Send an invitation to join the workspace.</p>
        </div>
      </div>
      <button 
        (click)="onClose()" 
        class="text-gray-400 hover:text-gray-600 p-1.5 rounded-lg hover:bg-gray-100 transition-colors">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
           <path d="M1.4 14L0 12.6L5.6 7L0 1.4L1.4 0L7 5.6L12.6 0L14 1.4L8.4 7L14 12.6L12.6 14L7 8.4L1.4 14Z" fill="#737685"/>
        </svg>

      </button>
    </div>
    <div class="px-6 py-4">
      @if (successMessage) {
        <div class="mb-4 p-3 bg-green-50 text-green-700 text-sm rounded-lg font-medium text-center">
          {{ successMessage }}
        </div>
      }

      @if (errorMessage) {
        <div class="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg font-medium text-center">
          {{ errorMessage }}
        </div>
      }

      <div class="mb-4">
        <label class="block text-xs font-bold uppercase tracking-wider text-[#64748B] mb-2">Email Address</label>
        <div class="relative flex items-center">
          <input 
            type="email" 
            [(ngModel)]="email" 
            placeholder="Enter email address" 
            [disabled]="isLoading"
            class="w-full px-4 py-3 pl-10 bg-[#F8FAFC] border border-gray-200 rounded-xl text-sm text-[#0F172A] focus:outline-none focus:border-[#003D9B] focus:bg-white transition-all"
          />
          <span class="absolute left-3 text-gray-400"></span>
        </div>
      </div>
    </div>
    <div class="flex items-center justify-end gap-3 px-6 py-4 bg-[#F8FAFC] border-t border-gray-100">
      <button 
        (click)="onClose()" 
        [disabled]="isLoading"
        class="px-4 py-2.5 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-200 transition-colors">
        Cancel
      </button>
      <button 
        (click)="sendInvitation()" 
        [disabled]="isLoading || !email"
        class="px-5 py-2.5 rounded-xl text-sm font-medium bg-[#003D9B] text-white hover:bg-[#002d72] disabled:opacity-50 transition-colors flex items-center gap-2">
        @if (isLoading) {
          <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        }
        Send Invitation
      </button>
    </div>

  </div>
</div>
