<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
    
    <div class="flex items-start justify-between px-6 pt-6 pb-4">
      <div class="flex  flex-col items-start gap-3">
        <div class="w-12 h-12 rounded-xl bg-[#F1F3FF] text-[#003D9B] flex items-center justify-center font-bold">
          <svg width="22" height="16" viewBox="0 0 22 16" fill="none" xmlns="http://www.w3.org/2000/svg">
           <path d="M17 10V7H14V5H17V2H19V5H22V7H19V10H17ZM8 8C6.9 8 5.95833 7.60833 5.175 6.825C4.39167 6.04167 4 5.1 4 4C4 2.9 4.39167 1.95833 5.175 1.175C5.95833 0.391667 6.9 0 8 0C9.1 0 10.0417 0.391667 10.825 1.175C11.6083 1.95833 12 2.9 12 4C12 5.1 11.6083 6.04167 10.825 6.825C10.0417 7.60833 9.1 8 8 8ZM0 16V13.2C0 12.6333 0.145833 12.1125 0.4375 11.6375C0.729167 11.1625 1.11667 10.8 1.6 10.55C2.63333 10.0333 3.68333 9.64583 4.75 9.3875C5.81667 9.12917 6.9 9 8 9C9.1 9 10.1833 9.12917 11.25 9.3875C12.3167 9.64583 13.3667 10.0333 14.4 10.55C14.8833 10.8 15.2708 11.1625 15.5625 11.6375C15.8542 12.1125 16 12.6333 16 13.2V16H0Z" fill="#003D9B"/>
          </svg>
         
        </div>
        <div>
          <h3 class="invite-title font-bold text-[#041B3C]">Invite Team Member</h3>
          <p class="invite-description">Send an invitation to join the Architectural Studio workspace.</p>
        </div>
      </div>
      <button 
        (click)="onClose()" 
        class="text-gray-400 hover:text-gray-600 p-1.5 rounded-lg hover:bg-gray-100 transition-colors">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
           <path d="M1.4 14L0 12.6L5.6 7L0 1.4L1.4 0L7 5.6L12.6 0L14 1.4L8.4 7L14 12.6L12.6 14L7 8.4L1.4 14Z" fill="#737685"/>
        </svg>

      </button>
    </div>
    <div class="px-6 py-4">
      @if (successMessage) {
        <div class="mb-4 p-3 bg-green-50 text-green-700 text-sm rounded-lg font-medium text-center">
          {{ successMessage }}
        </div>
      }

      @if (errorMessage) {
        <div class="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg font-medium text-center">
          {{ errorMessage }}
        </div>
      }

      <div class="mb-4">
        <label class="block text-xs font-bold uppercase tracking-wider text-[#64748B] mb-2">Email Address</label>
        <div class="relative flex items-center">
          <input 
            type="email" 
            [(ngModel)]="email" 
            placeholder="Enter email address" 
            [disabled]="isLoading"
            class="w-full px-4 py-3 pl-10 bg-[#D7E2FF] border border-gray-200 rounded-sm text-sm text-[#0F172A]"
          />
          <span class="absolute right-4 ">
            <svg width="15" height="48" viewBox="0 0 15 48" fill="none" xmlns="http://www.w3.org/2000/svg">
             <path d="M1.5 30C1.0875 30 0.734375 29.8531 0.440625 29.5594C0.146875 29.2656 0 28.9125 0 28.5V19.5C0 19.0875 0.146875 18.7344 0.440625 18.4406C0.734375 18.1469 1.0875 18 1.5 18H13.5C13.9125 18 14.2656 18.1469 14.5594 18.4406C14.8531 18.7344 15 19.0875 15 19.5V28.5C15 28.9125 14.8531 29.2656 14.5594 29.5594C14.2656 29.8531 13.9125 30 13.5 30H1.5ZM7.5 24.75L1.5 21V28.5H13.5V21L7.5 24.75ZM7.5 23.25L13.5 19.5H1.5L7.5 23.25ZM1.5 21V19.5V21V28.5V21Z" fill="#737685"/>
            </svg>

       </span>
          
        </div>
      </div>
    </div>
    <div class="flex items-center justify-end gap-3 px-6 py-4 bg-[#F8FAFC] border-t border-gray-100">
      <button 
        (click)="onClose()" 
        [disabled]="isLoading"
        class="px-4 py-2.5 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-200 transition-colors">
        Cancel
      </button>
      <button 
        (click)="sendInvitation()" 
        [disabled]="isLoading || !email"
        class="btn-custom  px-5 py-2.5 text-sm font-medium  flex items-center gap-2">
        @if (isLoading) {
          <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        }
        Send Invitation
      </button>
    </div>

  </div>
</div>
