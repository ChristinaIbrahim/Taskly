<div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm flex flex-col justify-between min-h-[220px] relative group">
  <div>
    <div class="flex justify-between items-start gap-4">
      <h3
        [routerLink]="['/project', $any(project)?.['id'], 'epics']"
        class="font-bold  tracking-tight hover:text-[#004EEB] cursor-pointer transition-colors flex-1"
        [style.color]="'var(--color-slate-dark)'"
        [style.font-size]="'var(--font-lg)'"
      >
        {{ $any(project)?.['name'] }}
      </h3>

      <button
        [routerLink]="['/project', $any(project)?.['id'], 'details']"
        class="text-gray-400 hover:text-gray-600 p-1.5 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer"
        title="Project Details"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.5" />
          <circle cx="12" cy="12" r="1.5" />
          <circle cx="12" cy="19" r="1.5" />
        </svg>
      </button>
    </div>

    <p
      [routerLink]="['/project', $any(project)?.['id'], 'epics']"
      class="text-gray-500 text-sm mt-3 leading-relaxed line-clamp-3 cursor-pointer hover:text-gray-700 transition-colors"
      [style.color]="'var(--color-text-body)'"
      [style.font-size]="'var(--font-sm)'"
     
      >
      {{ $any(project)?.['description'] }}
    </p>
  </div>

  <div class="flex items-center justify-between border-t border-gray-50 pt-4 mt-4">
    <span class="text-[10px] font-bold uppercase tracking-wider text-[#737685]"
       [style.font-size]="'var(--font-xs)'">Created At</span>
    <span class="text-sm " 
      [style.color]="'var(--color-text-body)'"
      [style.font-size]="'var(--font-sm)'">
      {{ $any(project)?.['created_at'] | date: "dd MMM yyyy" }}
    </span>
  </div>
</div>
