<div class="p-4 sm:p-8 max-w-7xl mx-auto relative min-h-[calc(100vh-80px)] pb-24 sm:pb-8">
  <header class="flex items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-[#0A192F]">Projects</h1>
      <p class="text-sm sm:text-base text-slate-500 mt-1">Manage and curate your projects</p>
    </div>

    <a
      routerLink="add"
      class="hidden sm:flex bg-[#0052CC] hover:bg-[#0043a8] text-white px-6 py-3 rounded-lg font-semibold items-center gap-2 transition-all shadow-sm text-base"
    >
      <span>+</span> Create New Project
    </a>
  </header>
  <section class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
    @for (project of projects; track project.id) {
      <app-card-project [project]="project"></app-card-project>
    }
    <a
      routerLink="add"
      class="hidden sm:flex border-2 border-dashed border-slate-200 rounded-2xl flex-col items-center justify-center min-h-[220px] hover:border-blue-400 hover:bg-slate-50 transition-all p-6 text-center group"
    >
      <div
        class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-black-500 shadow-sm border border-slate-300 group-hover:scale-110 group-hover:shadow-md transition-all duration-300 mb-4"
      >
        <span class="text-2xl font-bold text-blue-600">+</span>
      </div>

      <span class="text-sm font-bold uppercase tracking-widest text-slate-500 group-hover:text-blue-600">
        Add Project
      </span>
    </a>
  </section>

  <a
    routerLink="add"
    class="sm:hidden fixed bottom-6 right-6 w-14 h-14 bg-[#0052CC] hover:bg-[#0043a8] text-white rounded-full flex items-center justify-center shadow-xl z-40 transition-transform active:scale-95"
    aria-label="Create New Project"
  >
    <span class="text-3xl font-light leading-none">+</span>
  </a>

  @if (projects.length > 0) {
    <div
      class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-8 sm:pt-12 mt-8 sm:mt-12 border-t border-slate-100"
    >
      <div class="text-xs sm:text-sm text-slate-500 font-medium text-center sm:text-left">
        Showing {{ projects.length }} of {{ totalCount }} active projects
      </div>

      <div class="flex items-center gap-1 flex-wrap justify-center">
        <button
          (click)="goToPage(currentPage - 1)"
          [disabled]="currentPage === 1"
          class="w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center rounded-lg border border-slate-200 hover:bg-slate-50 disabled:opacity-50"
        >
          ‹
        </button>

        @for (page of pagesArray; track page) {
          <button
            (click)="goToPage(page)"
            [class.bg-[#0052CC]]="currentPage === page"
            [class.text-white]="currentPage === page"
            class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg border border-slate-200 hover:bg-slate-50 text-sm font-medium"
          >
            {{ page }}
          </button>
        }

        <button
          (click)="goToPage(currentPage + 1)"
          class="w-9 h-9 sm:w-10 sm:h-10 flex items-center justify-center rounded-lg border border-slate-200 hover:bg-slate-50"
        >
          ›
        </button>
      </div>
    </div>
  }
</div>
