<div class="w-full p-4 md:p-8">
  <div class="mb-6">
    <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
    <h1 class="text-[32px] font-bold" style="color:var(--color-third-heading);">Create New Task</h1>
    <p class="text-xs mt-1" style="color:var(--color-text-body); font-size: var(--font-sm);">Initialize a new work item within the Architectural Workspace ecosystem.</p>
  </div>

  @if (errorMessage) {
    <div class="mb-4 p-3 bg-red-100 text-red-700 text-xs rounded-xl">
      {{ errorMessage }}
    </div>
  }

  <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm">
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-[11px] font-bold uppercase text-gray-500 mb-2">Title <span class="text-red-500">*</span></label>
        <input
          type="text"
          formControlName="title"
          placeholder="e.g., Finalize structural schematics"
          class="w-full bg-[#D7E2FF] border border-gray-200 px-4 py-3 text-xs md:text-[16px] text-[#737685] focus:outline-none focus:border-[#004EEB]"
        />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-[11px] font-bold uppercase text-gray-500 mb-2">Status <span class="text-red-500">*</span></label>
          <div class="relative">
            <select
              formControlName="status"
              class="w-full bg-[#D7E2FF] border border-gray-200 px-4 py-3 text-xs md:text-sm text-[#041B3C] appearance-none focus:outline-none focus:border-[#004EEB] cursor-pointer"
            >
              @for (st of statuses; track st.key) {
                <option [value]="st.key">{{ st.label }}</option>
              }
            </select>
            <svg class="w-4 h-4 text-gray-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase text-gray-500 mb-2">Assignee</label>
          <div class="relative">
            <select
              formControlName="assignee"
              class="w-full bg-[#D7E2FF] border border-gray-200 px-4 py-3 text-xs md:text-sm text-[#041B3C] appearance-none focus:outline-none focus:border-[#004EEB] cursor-pointer"
            >
              <option [ngValue]="null">Select Team Member</option>
              @for (member of members; track member.id) {
                <option [ngValue]="member">{{ member.name || member.user_name || 'Member' }}</option>
              }
            </select>
            <svg class="w-4 h-4 text-gray-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>
      </div>
      <div>
        <label class="block text-[11px] font-bold uppercase text-gray-500 mb-2">Epic</label>
        <div class="relative">
          <select
            formControlName="epic_id"
            class="w-full bg-[#D7E2FF] border border-gray-200 px-4 py-3 text-xs md:text-sm text-[#041B3C] appearance-none focus:outline-none focus:border-[#004EEB] cursor-pointer"
          >
            <option value="">Select Epic Link</option>
            @for (epic of epics; track epic.id) {
              <option [value]="epic.id">{{ formatEpicLabel(epic) }}</option>
            }
          </select>
          <svg class="w-4 h-4 text-gray-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
      </div>
      <div>
        <label class="block text-[11px] font-bold uppercase text-gray-500 mb-2">Due Date</label>
        <div class="relative">
          <input
            type="date"
            formControlName="due_date"
            class="w-full bg-[#D7E2FF] border border-gray-200 px-4 py-3 text-xs md:text-sm text-[#041B3C] focus:outline-none focus:border-[#004EEB]"
          />
        </div>
      </div>
      <div>
        <label class="block text-[11px] font-bold uppercase text-gray-500 mb-2">Description</label>
        <textarea
          rows="4"
          formControlName="description"
          placeholder="Provide detailed context for this task..."
          class="w-full bg-[#D7E2FF] border border-gray-200 px-4 py-3 text-xs md:text-sm text-[#041B3C] focus:outline-none focus:border-[#004EEB] resize-none"
        ></textarea>
      </div>

      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
        <button
          type="button"
          (click)="onBack()"
          class="px-5 py-2.5 font-semibold text-[#4F5F7B] hover:bg-gray-100 transition-colors cursor-pointer"
          style="font-size: var(--font-base);"
        >
          Back
        </button>
        <button
          type="submit"
          [disabled]="isLoading"
          class="text-white px-[32px] py-[12px] rounded-[2px] font-semibold hover:bg-blue-700 transition-colors cursor-pointer"
          style="background: var(--primary-gradient); font-size: var(--font-base);"
        >
          {{ isLoading ? 'Creating...' : 'Create Task' }}
        </button>
      </div>
    </form>
  </div>
</div>
