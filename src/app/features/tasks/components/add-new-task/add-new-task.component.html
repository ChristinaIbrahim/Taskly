<div class="max-w-7xl mx-auto p-4 md:p-6">
  <div class="mb-6">
    <div class="text-xs text-gray-400 mb-1">
      <a routerLink="/project" class="hover:underline cursor-pointer">PROJECTS</a> 
      <span class="mx-1">></span> PROJECT ALPHA <span class="mx-1">></span> <span class="text-[#041B3C] font-semibold">TASKS</span>
    </div>
    <h1 class="text-2xl font-bold text-[#041B3C]">Active Workboard</h1>
    <p class="text-xs text-gray-500 mt-1">Curating Project Alpha's production pipeline and milestones.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-[#F8FAFC] border border-gray-200 rounded-2xl p-4 flex flex-col">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-200">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-gray-400"></span>
          <h2 class="text-xs font-bold uppercase text-[#041B3C]">TO DO</h2>
          <span class="bg-gray-200 text-gray-700 text-[10px] font-bold px-2 py-0.5 rounded-full">3</span>
        </div>
        <button class="text-gray-400 hover:text-[#004EEB] text-lg font-bold cursor-pointer">+</button>
      </div>
      <button routerLink="new" [queryParams]="{status: 'TO_DO'}" class="w-full border border-dashed border-gray-300 hover:border-[#004EEB] text-gray-500 hover:text-[#004EEB] rounded-xl py-3 text-xs font-semibold flex items-center justify-center gap-2 mb-3 bg-white transition-colors cursor-pointer">
        <span>+</span> ADD NEW TASK
      </button>
      <div class="space-y-3">
        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow">
          <h3 class="text-xs md:text-sm font-semibold text-[#041B3C] mb-2">Incorporate stakeholder feedback from v1.2 Review</h3>
          
          <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-100 text-xs text-gray-500">
            <div class="flex items-center gap-1 text-[11px] font-medium text-gray-500">
              <svg class="w-3.5 h-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <span>TODAY</span>
            </div>
            <div class="flex items-center">
              <div class="w-7 h-7 rounded-full bg-[#004EEB] text-white flex items-center justify-center text-[10px] font-bold shadow-sm" title="Assigned Member">
                MT
              </div>
            </div>
          </div>
        </div>

        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow">
          <h3 class="text-xs md:text-sm font-semibold text-[#041B3C] mb-2">Audit typography hierarchy for mobile views</h3>
          
          <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-100 text-xs text-gray-500">
            <div class="flex items-center gap-1 text-[11px] font-medium text-gray-500">
              <svg class="w-3.5 h-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <span>TOMORROW</span>
            </div>
            <div class="flex items-center">
              <div class="w-7 h-7 rounded-full bg-[#004EEB] text-white flex items-center justify-center text-[10px] font-bold shadow-sm" title="Assigned Member">
                MT
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="bg-[#F8FAFC] border border-gray-200 rounded-2xl p-4 flex flex-col">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-200">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-[#004EEB]"></span>
          <h2 class="text-xs font-bold uppercase text-[#041B3C]">IN PROGRESS</h2>
          <span class="bg-blue-100 text-[#004EEB] text-[10px] font-bold px-2 py-0.5 rounded-full">1</span>
        </div>
        <button class="text-gray-400 hover:text-[#004EEB] text-lg font-bold cursor-pointer">+</button>
      </div>

      <button routerLink="new" [queryParams]="{status: 'IN_PROGRESS'}" class="w-full border border-dashed border-gray-300 hover:border-[#004EEB] text-gray-500 hover:text-[#004EEB] rounded-xl py-3 text-xs font-semibold flex items-center justify-center gap-2 mb-3 bg-white transition-colors cursor-pointer">
        <span>+</span> ADD NEW TASK
      </button>

      <div class="space-y-3">
        <div class="bg-white border border-[#004EEB] rounded-xl p-4 shadow-sm">
          <h3 class="text-xs md:text-sm font-semibold text-[#041B3C] mb-2">Dashboard</h3>
          
          <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-100 text-xs text-gray-500">
            <div class="flex items-center gap-1 text-[11px] font-medium text-[#004EEB]">
              <svg class="w-3.5 h-3.5 text-[#004EEB]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              <span>TODAY</span>
            </div>
            <div class="flex items-center">
              <div class="w-7 h-7 rounded-full bg-[#004EEB] text-white flex items-center justify-center text-[10px] font-bold shadow-sm" title="Assigned Member">
                MT
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="bg-[#F8FAFC] border border-gray-200 rounded-2xl p-4 flex flex-col">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-gray-200">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
          <h2 class="text-xs font-bold uppercase text-[#041B3C]">BLOCKED</h2>
          <span class="bg-red-100 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
        </div>
        <button class="text-gray-400 hover:text-[#004EEB] text-lg font-bold cursor-pointer">+</button>
      </div>

      <button routerLink="new" [queryParams]="{status: 'BLOCKED'}" class="w-full border border-dashed border-gray-300 hover:border-[#004EEB] text-gray-500 hover:text-[#004EEB] rounded-xl py-3 text-xs font-semibold flex items-center justify-center gap-2 mb-3 bg-white transition-colors cursor-pointer">
        <span>+</span> ADD NEW TASK
      </button>

      <div class="space-y-3">
      </div>
    </div>

  </div>
</div>
