<div class="p-6 max-w-7xl mx-auto">
  <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <div class="hidden md:block">
          <app-breadcrumb [items]="breadCrumbItems"></app-breadcrumb>
      </div>
      <h1 class="text-2xl font-bold text-[#041B3C]">Active Workboard</h1>
      <p class="text-xs text-gray-500 mt-1">Curating Project Alpha's production pipeline and milestones.</p>
    </div>

    <div class="flex items-center gap-3">
      <div class="relative flex items-center">
        <span class="absolute left-3.5 flex items-center pointer-events-none">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.45 13.5L7.725 8.775C7.35 9.075 6.91875 9.3125 6.43125 9.4875C5.94375 9.6625 5.425 9.75 4.875 9.75C3.5125 9.75 2.35938 9.27813 1.41562 8.33438C0.471875 7.39063 0 6.2375 0 4.875C0 3.5125 0.471875 2.35938 1.41562 1.41562C2.35938 0.471875 3.5125 0 4.875 0C6.2375 0 7.39063 0.471875 8.33438 1.41562C9.27813 2.35938 9.75 3.5125 9.75 4.875C9.75 5.425 9.6625 5.94375 9.4875 6.43125C9.3125 6.91875 9.075 7.35 8.775 7.725L13.5 12.45L12.45 13.5ZM4.875 8.25C5.8125 8.25 6.60938 7.92188 7.26562 7.26562C7.92188 6.60938 8.25 5.8125 8.25 4.875C8.25 3.9375 7.92188 3.14062 7.26562 2.48438C6.60938 1.82812 5.8125 1.5 4.875 1.5C3.9375 1.5 3.14062 1.82812 2.48438 2.48438C1.82812 3.14062 1.5 3.9375 1.5 4.875C1.5 5.8125 1.82812 6.60938 2.48438 7.26562C3.14062 7.92188 3.9375 8.25 4.875 8.25Z" fill="#94A3B8"/>
          </svg>
        </span>
        <input
          type="text"
          placeholder="Search tasks..."
          (input)="onSearchInput($event)"
          class="bg-[#D7E2FF] pl-10 pr-4 py-2 text-xs text-[#041B3C] focus:outline-none focus:border-[#004EEB] w-60"
        />
      </div>
      <div class="relative flex items-center bg-white border border-gray-200 rounded-xl px-3 py-2">
        @if (currentView === 'board') {
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" class="mr-2">
            <path d="M0 6V0H6V6H0ZM0 13.5V7.5H6V13.5H0ZM7.5 6V0H13.5V6H7.5ZM7.5 13.5V7.5H13.5V13.5H7.5ZM1.5 4.5H4.5V1.5H1.5V4.5ZM9 4.5H12V1.5H9V4.5ZM9 12H12V9H9V12ZM1.5 12H4.5V9H1.5V12Z" fill="#041B3C"/>
          </svg>
        } @else {
          <svg width="14" height="12" viewBox="0 0 14 12" fill="none" xmlns="http://www.w3.org/2000/svg" class="mr-2">
            <path d="M1.5 1.5H3V0H1.5V1.5ZM4.5 0V1.5H12.5V0H4.5ZM1.5 6.75H3V5.25H1.5V6.75ZM4.5 5.25V6.75H12.5V5.25H4.5ZM1.5 12H3V10.5H1.5V12ZM4.5 10.5V12H12.5V10.5H4.5Z" fill="#041B3C"/>
          </svg>
        }
        <select
          [value]="currentView"
          (change)="onViewChange($event)"
          class="bg-transparent text-xs font-semibold text-[#041B3C] focus:outline-none cursor-pointer pr-2"
        >
          <option value="board">Board View</option>
          <option value="list">List View</option>
        </select>
      </div>

      <div class="bg-[#D7E2FF] p-2.5 rounded-xl flex items-center justify-center cursor-pointer hover:opacity-90 transition-opacity">
        <svg width="16" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 12V10H11V12H7ZM3 7V5H15V7H3ZM0 2V0H18V2H0Z" fill="#041B3C"/>
        </svg>
      </div>
    </div>
  </div>

  @if (currentView === 'board') {
    <app-board-view-task
      [projectId]="projectId"
      (taskClick)="openTaskDetails($event)"
      [searchTerm]="searchTerm"
    ></app-board-view-task>
  } @else if (currentView === 'list') {
    <app-list-view-task
      [projectId]="projectId"
      (taskClick)="openTaskDetails($event)"
      [searchTerm]="searchTerm"
    ></app-list-view-task>
  }

  @if (selectedTaskId && selectedProjectId) {
    <app-task-details-popup
      [taskId]="selectedTaskId"
      [projectId]="selectedProjectId"
      (close)="closeTaskDetails()"
    ></app-task-details-popup>
  }
</div>
