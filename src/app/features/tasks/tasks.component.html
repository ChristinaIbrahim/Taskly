<div class="p-6 max-w-7xl mx-auto">
  <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <div class="text-xs text-gray-400 mb-1">PROJECTS > PROJECT ALPHA > TASKS</div>
      <h1 class="text-2xl font-bold text-[#041B3C]">Active Workboard</h1>
      <p class="text-xs text-gray-500 mt-1">Curating Project Alpha's production pipeline and milestones.</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="relative">
        <input 
          type="text" 
          placeholder="Search tasks..." 
          class="bg-[#D7E2FF]  px-4 py-2 text-xs text-[#041B3C] focus:outline-none focus:border-[#004EEB] w-60"
        />
      </div>

      <select 
        class="bg-[#fff] border border-gray-200 rounded-xl px-4 py-2 text-xs font-semibold text-[#041B3C] focus:outline-none focus:border-[#004EEB] cursor-pointer"
      >
        <option value="board">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
             <path d="M0 6V0H6V6H0ZM0 13.5V7.5H6V13.5H0ZM7.5 6V0H13.5V6H7.5ZM7.5 13.5V7.5H13.5V13.5H7.5ZM1.5 4.5H4.5V1.5H1.5V4.5ZM9 4.5H12V1.5H9V4.5ZM9 12H12V9H9V12ZM1.5 12H4.5V9H1.5V12Z" fill="#041B3C"/>
            </svg>

            Board View</option>
        <option value="list">List View</option>
      </select>
    </div>
     <div>
    <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 12V10H11V12H7ZM3 7V5H15V7H3ZM0 2V0H18V2H0Z" fill="#041B3C"/>
    </svg>

  </div>
  </div>

  @if (currentView === 'board') {
    <app-board-view-task [projectId]="projectId"></app-board-view-task>
  } @else {
    <div class="text-xs text-gray-500">List View will appear here</div>
  }

 
 
</div>
