<div
  (click)="onCardClick()"
  (keyup.enter)="onCardClick()"
  (keydown.space)="$event.preventDefault(); onCardClick()"
  tabindex="0"
  role="button"
  class="relative overflow-hidden bg-white border border-[#E2E8F0] rounded-xl md:rounded-2xl p-5 md:p-6 shadow-sm hover:shadow-md transition-all flex flex-col justify-between cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#004EEB] w-full"
>
  <div class="hidden md:block absolute top-0 left-0 w-1.5 h-full bg-[#004E32]"></div>

  <div>
    <div class="flex items-center justify-between mb-3 md:pl-2">
      <span
        class="text-[11px] font-bold px-2.5 py-1 rounded-md tracking-wider text-[#004E32] md:bg-[var(--epic-green-light)] bg-[#DAE2FF]"
       
      >
        {{ epic.epic_id || 'EPIC-00' }}
      </span>
      <button
        class="text-gray-400 hover:text-gray-600 focus:outline-none cursor-pointer"
        (click)="$event.stopPropagation()"
        type="button"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M5 12h.01M12 12h.01M19 12h.01"
          />
        </svg>
      </button>
    </div>

    <h3 class=" font-bold text-[#041B3C] mb-4 md:mb-6 md:pl-2 line-clamp-2"
         style="font-size: var(--font-title);">
      {{ epic.title }}
    </h3>

    <div class="flex items-center justify-between md:justify-start md:gap-3 mb-1 md:mb-4 md:pl-2">
      <div class="flex items-center gap-2 md:gap-3">
        <div
          class="w-7 h-7 md:w-9 md:h-9 rounded-md flex items-center justify-center font-bold md:text-xs md:text-[#002113] text-[#fff] md:bg-[var(--epic-green-dark)] bg-[#003D9B]"
          style="font-size: var(--font-sm); border-radius: var(--rounded-md);"
        >
          {{ getInitials(epic.assignee?.name) }}
        </div>
        <div>
          <span class="block text-[10px] text-gray-400 leading-none mb-0.5 md:uppercase md:tracking-wider md:font-semibold">
            Assignee
          </span>
          <span class="text-[#041B3C] font-semibold text-[12px] md:text-[13px]">
            {{ epic.assignee?.name || 'Mohammed Taha' }}
          </span>
        </div>
      </div>

      <div class="text-right md:hidden">
        <span class="block text-[10px] text-gray-400 leading-none mb-0.5 uppercase">
          Deadline
        </span>
        <span class="text-[#64748B] text-[12px] font-medium">
          {{ epic.deadline | date: 'MMM d, y' }}
        </span>
      </div>
    </div>
  </div>

  <div class="hidden md:block md:pl-2">
    <div class="border-t border-gray-100 my-2"></div>
    <div class="flex items-center justify-between text-[12px] text-gray-500 pt-2">
      <span class="flex items-center gap-1.5">

.34583 3.5 4.66667 3.5Z" fill="#434654" fill-opacity="0.8"/>
          </svg>
        Created by:
        <strong class="text-gray-700 font-medium">
          {{ epic.created_by?.name || 'Mohammed Taha' }}
        </strong>
      </span>
      <span class="flex items-center gap-1.5">
         <svg width="11" height="12" viewBox="0 0 11 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1.16667 11.6667C0.845833 11.6667 0.571181 11.5524 0.342708 11.324C0.114236 11.0955 0 10.8208 0 10.5V2.33333C0 2.0125 0.114236 1.73785 0.342708 1.50937C0.571181 1.2809 0.845833 1.16667 1.16667 1.16667H1.75V0H2.91667V1.16667H7.58333V0H8.75V1.16667H9.33333C9.65417 1.16667 9.92882 1.2809 10.1573 1.50937C10.3858 1.73785 10.5 2.0125 10.5 2.33333V10.5C10.5 10.8208 10.3858 11.0955 10.1573 11.324C9.92882 11.5524 9.65417 11.6667 9.33333 11.6667H1.16667ZM1.16667 10.5H9.33333V4.66667H1.16667V10.5ZM1.16667 3.5H9.33333V2.33333H1.16667V3.5ZM1.16667 3.5V2.33333V3.5Z" fill="#434654" fill-opacity="0.8"/>
         </svg>
        {{ epic.created_at | date: 'd MMM yyyy' }}
      </span>
    </div>
  </div>
</div>
